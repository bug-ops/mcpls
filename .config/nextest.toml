# Nextest configuration for mcpls project

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false

[profile.ci]
retries = 2
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

# Test threads configuration
test-threads = "num-cpus"

# #374 added a `subprocess-mock-pipe` test-group here, capping
# `bridge::translator::`/`bridge::state::`/`lsp::client::`/`lsp::lifecycle::`
# to 2 concurrent threads, on the hypothesis that a `cat`/`echo`-subprocess
# loopback mock LSP transport in those modules' tests was causing OS
# process-spawn contention severe enough to produce a 120s hard timeout or
# a spurious assertion failure. A live-hang sample taken while investigating
# #378 showed the actual cause was a lost-wakeup/deadlock in the runtime
# (parked in mio with zero runnable tasks), not subprocess-spawn contention,
# so this cap was never actually addressing it. #378 fixed the real issue:
# replacing the `cat`/`echo` loopback (and every placeholder child spawn
# these four modules' tests used to need) with an in-memory
# `tokio::io::duplex` pipe pair (`crate::test_lsp`), plus an EOF guard and a
# bounded read timeout on the shared harness's `read_framed_message`.
# Stress runs after that fix (hundreds of full-suite and targeted-concurrent
# repetitions) reproduced zero hangs/failures, so this cap is removed rather
# than narrowed or kept.

# Timeout settings
[profile.default.junit]
path = "target/nextest/default/junit.xml"

[profile.ci.junit]
path = "target/nextest/ci/junit.xml"
