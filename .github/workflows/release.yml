name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  # Create GitHub Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Check registry manifest version
        run: scripts/check-server-json-version.sh

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release v${{ steps.get_version.outputs.version }}

  # Build cross-platform binaries with a read-only token
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use_cross: false

          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_cross: true

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            use_cross: false

          # macOS aarch64 (M1/M2)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use_cross: false

          # Windows aarch64 (ARM64)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            use_cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # dtolnay/rust-toolchain stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust target stdlib
        run: rustup target add ${{ matrix.target }}

      # The cross image is pinned by digest in Cross.toml
      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross@0.2.5

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache v2
        with:
          shared-key: "release-${{ matrix.target }}"

      - name: Build release (cross)
        if: matrix.use_cross
        run: cross build --package mcpls --release --target ${{ matrix.target }}

      - name: Build release (native)
        if: "!matrix.use_cross"
        run: cargo build --package mcpls --release --target ${{ matrix.target }}

      - name: Get binary name
        id: binary
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "name=mcpls.exe" >> $GITHUB_OUTPUT
          else
            echo "name=mcpls" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Strip binary (Linux/macOS, native only)
        if: matrix.os != 'windows-latest' && !matrix.use_cross
        run: strip target/${{ matrix.target }}/release/${{ steps.binary.outputs.name }}

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mcpls-${{ matrix.target }}.tar.gz ${{ steps.binary.outputs.name }}
          cd ../../..
          shasum -a 256 mcpls-${{ matrix.target }}.tar.gz > mcpls-${{ matrix.target }}.tar.gz.sha256

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mcpls-${{ matrix.target }}.zip ${{ steps.binary.outputs.name }}
          cd ../../..
          certUtil -hashfile mcpls-${{ matrix.target }}.zip SHA256 > mcpls-${{ matrix.target }}.zip.sha256
        shell: cmd

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: mcpls-${{ matrix.target }}.*
          if-no-files-found: error

  # Attest and upload the archives; only this job holds write and OIDC tokens next to the binaries
  upload-assets:
    name: Attest and Upload Assets
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mcpls-*.tar.gz
            dist/mcpls-*.zip

      - name: Upload release archives
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/mcpls-*

  # Publish to crates.io using Trusted Publishing (OIDC)
  publish-crates:
    name: Publish to crates.io
    needs: [create-release, upload-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # dtolnay/rust-toolchain stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache v2

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # rust-lang/crates-io-auth-action v1

      - name: Publish crates to crates.io
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # katyo/publish-crates v2
        with:
          registry-token: ${{ steps.crates-io-auth.outputs.token }}
          ignore-unpublished-changes: true
          no-verify: true
          publish-delay: 10000

  # Publish the server manifest to the official MCP registry (re-runnable; last job, so a failure leaves everything else intact)
  # Disabled until the maintainer confirms the first public registry publication (follow-up: enable publish-registry); remove `false &&` to enable
  publish-registry:
    name: Publish to MCP Registry
    needs: [publish-crates]
    if: false && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check registry manifest version
        run: scripts/check-server-json-version.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  # Update release notes with installation instructions
  update-release-notes:
    name: Update Release Notes
    needs: [create-release, upload-assets, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update release with installation instructions
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          append_body: true
          body: |

            ## Installation

            ### Binary Installation

            Download the appropriate binary for your platform from the assets below:

            - **Linux x86_64**: `mcpls-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux aarch64**: `mcpls-aarch64-unknown-linux-gnu.tar.gz`
            - **macOS x86_64**: `mcpls-x86_64-apple-darwin.tar.gz`
            - **macOS ARM64**: `mcpls-aarch64-apple-darwin.tar.gz`
            - **Windows x64**: `mcpls-x86_64-pc-windows-msvc.zip`
            - **Windows ARM64**: `mcpls-aarch64-pc-windows-msvc.zip`

            Extract and add to your PATH:

            ```bash
            # Linux/macOS
            tar xzf mcpls-*.tar.gz
            sudo mv mcpls /usr/local/bin/

            # Verify installation
            mcpls --version
            ```

            ### Cargo Installation

            ```bash
            cargo install mcpls
            ```

            ### Claude Code Integration

            Add to `~/.claude/claude_desktop_config.json`:

            ```json
            {
              "mcpServers": {
                "mcpls": { "command": "mcpls", "args": [] }
              }
            }
            ```

            ## Verification

            Every archive carries a build-provenance attestation that ties it to this workflow and commit:

            ```bash
            gh attestation verify mcpls-x86_64-unknown-linux-gnu.tar.gz --repo bug-ops/mcpls
            ```

            SHA256 checksums are available for all artifacts (`.sha256` files). They come from the same build as the archives, so use the attestation as the integrity proof.
