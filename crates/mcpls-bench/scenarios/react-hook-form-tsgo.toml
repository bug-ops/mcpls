name = "react-hook-form-tsgo"
setup = [
    { command = "pnpm", args = ["install", "--frozen-lockfile", "--ignore-scripts"] },
]

[source]
kind = "git"
url = "https://github.com/react-hook-form/react-hook-form"
commit = "3e6f6815f7ac8f4ef3df429a7157844f69e514fb" # v7.69.0

[server]
language_id = "typescript"
file_patterns = ["**/*.ts", "**/*.tsx"]
args = ["--lsp", "--stdio"]

[server.executable]
command = "tsgo"
version_args = ["--version"]

[[runtime]]
command = "node"
version_args = ["--version"]

[[runtime]]
command = "pnpm"
version_args = ["--version"]

[ready_probe]
kind = "hover"
file = "src/useForm.ts"
position = { line = 4, character = 9 }
contains = "deepEqual"
symbol = "deepEqual"

[[probes]]
kind = "hover"
file = "src/useForm.ts"
position = { line = 4, character = 9 }
contains = "deepEqual"
symbol = "deepEqual"

[[probes]]
kind = "definition"
file = "src/useForm.ts"
position = { line = 4, character = 9 }
uri_suffix = "src/utils/deepEqual.ts"
symbol = "deepEqual"

[[probes]]
kind = "references"
file = "src/utils/deepEqual.ts"
position = { line = 5, character = 27 }
min_count = 2
symbol = "deepEqual"

[[probes]]
kind = "document_symbols"
file = "src/useForm.ts"
symbol = "useForm"
