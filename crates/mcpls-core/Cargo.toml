[package]
name = "mcpls-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for MCP to LSP protocol translation"
keywords = ["mcp", "lsp", "language-server", "protocol"]
categories = ["development-tools"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
futures = { workspace = true }
http-body = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "server"] }
hyper-util = { workspace = true, optional = true, features = ["service", "tokio"] }
ignore = { workspace = true }
lsp-types = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
schemars = { workspace = true, features = ["chrono04"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
socket2 = { workspace = true, features = ["all"], optional = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, features = [
    "tokio1",
    "job-object",
    "kill-on-drop",
] }
winapi-util = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = []
transport-http = [
    "rmcp/transport-streamable-http-server",
    "dep:axum",
    "dep:http-body",
    "dep:hyper",
    "dep:hyper-util",
    "dep:socket2",
    "dep:tokio-util",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
