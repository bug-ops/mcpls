[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
authors = ["Andrei G. <k05h31@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bug-ops/mcpls"
homepage = "https://bug-ops.github.io/mcpls/"
description = "Universal MCP to LSP bridge - expose Language Server Protocol capabilities as MCP tools"
keywords = ["mcp", "lsp", "language-server", "ai", "claude"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Sorted alphabetically
anyhow = "1.0"
assert_cmd = "2.2"
axum = "0.8"
chrono = "0.4.45"
clap = "4.6"
dirs = "7.0"
dunce = "1.0.5"
futures = "0.3"
http-body = "1.0"
hyper = "1.11"
hyper-util = "0.1.20"
ignore = "0.4"
libc = "0.2"
lsp-types = { package = "gen-lsp-types", version = "=0.11.0" }
mcpls-core = { path = "crates/mcpls-core", version = "0.7.0" }
nix = { version = "0.31", default-features = false, features = ["user"] }
predicates = "3.1"
process-wrap = { version = "10.0.1", default-features = false }
proptest = "1.11"
rmcp = "3.5.1"
rstest = "0.27"
rustix = { version = "1.1", features = ["process"] }
schemars = "1.2"
serde = "1.0"
serde_json = "1.0"
socket2 = "0.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.53"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
winapi-util = "0.1.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "warn"
assert_is_empty = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
